services:
  redis:
    image: redis:latest
    container_name: redis-ephemeral-tiny
    ports:
      - "6379:6379"
    # volumes:
    #   - redis-data:/data
    environment:
      - REDIS_ARGS=--maxmemory-policy allkeys-lru --maxmemory 16mb
    restart: unless-stopped

